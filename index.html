<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Husköp — en praktisk guide</title>
<style>
body{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.9;max-width:1120px;margin:auto;padding:32px;color:#20231f;background:#f5f1e8}article{max-width:760px;margin:auto;background:#fffdf8;padding:60px 72px;border:1px solid #dedbd2;border-radius:14px}h1,h2,h3{font-family:system-ui,sans-serif;letter-spacing:-.035em}h1{font-size:clamp(29px,4vw,39px);line-height:1.13;margin:3.1em 0 .8em}h1:first-child{display:none}h2{font-size:22px;line-height:1.25;margin:2.65em 0 .8em}h3{font-size:18px;line-height:1.3;margin:2em 0 .55em}p{margin:0 0 1.35em;max-width:68ch}ul{margin:-.35em 0 1.45em;padding-left:1.25em}li{margin:.28em 0}.article-table-wrap{margin:1.8em 0 2.1em;overflow-x:auto;border:1px solid #dedbd2;border-radius:12px}.article-table{width:100%;border-collapse:collapse;min-width:600px;font-size:16px;line-height:1.5}.article-table th,.article-table td{padding:13px 14px;text-align:left;border-bottom:1px solid #dedbd2;vertical-align:top}.article-table th{background:#e7efe9;font:700 12px/1.35 system-ui,sans-serif}.article-table tr:last-child td{border-bottom:0}@media(max-width:620px){body{font-size:17px;line-height:1.82;padding:12px}article{padding:38px 23px}h1{font-size:28px}h2{font-size:20px}}
</style>
</head>
<body><article id="content">
<!-- Original guide content is preserved below; typography/table transformations are applied by the script. -->
<script>
const sourceUrl='https://raw.githubusercontent.com/AntonAnnenkov/antonannenkov.github.io/main/index.html';
fetch(sourceUrl).then(r=>r.text()).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html'),source=doc.querySelector('article');if(!source)return;document.getElementById('content').innerHTML=source.innerHTML;joinBrokenHeadings();makeMaintenanceTable();makeSubheadings();});
function joinBrokenHeadings(){const pairs=[['14. Amortering är inte samma sak som','kostnad'],['4. Bostad som investering – vad är','alternativkostnaden?'],['9. Slutsatsen om bostaden som','investering'],['11. Kontantinsats, bolån och köpets','engångskostnader'],['19. Underhåll – huset kommer att kosta','även när inget går sönder'],['25. Försök inte förutsäga','bostadsmarknaden'],['26. Prisbedömning: vad är huset värt för','oss?']];pairs.forEach(([start,rest])=>{const h=[...document.querySelectorAll('h1,h2')].find(x=>x.textContent.trim()===start);if(!h)return;const p=h.nextElementSibling;if(p&&p.tagName==='P'&&p.textContent.trim().startsWith(rest)){h.textContent=start+' '+rest;const remaining=p.textContent.trim().slice(rest.length).trim();if(remaining)p.textContent=remaining;else p.remove()}})}
function makeMaintenanceTable(){const marker=[...document.querySelectorAll('p')].find(p=>p.textContent.replace(/\s+/g,' ').trim().startsWith('Del Ålder Förväntad'));if(!marker)return;const rows=['Tak','Dränering','Värmepump','Fasad','Fönster','Badrum'];const wrap=document.createElement('div');wrap.className='article-table-wrap';wrap.innerHTML='<table class="article-table"><thead><tr><th>Del</th><th>Ålder</th><th>Förväntad livslängd</th><th>Ungefärlig kostnad</th><th>Möjligt år</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+r+'</td><td></td><td></td><td></td><td></td></tr>').join('')+'</tbody></table>';marker.replaceWith(wrap);let n=wrap.nextElementSibling;while(n&&rows.includes(n.textContent.trim())){const next=n.nextElementSibling;n.remove();n=next}}
function makeSubheadings(){const labels=new Set(['Måsten','Bör-krav','Önskemål','Villa','Äganderättsradhus','Bostadsrätt','Bostaden som konsumtion','Bostaden som tillgång','Nominell ökning','Reell ökning','Alternativ A – köpa','Alternativ B – hyra + investera','Grund och fukt','Tak och fasad','Våtutrymmen','Installationer','Radon','Energideklaration','Värmesystem','Buffert','Underhållsfond','Brunn','Avlopp','Marknadsvärde','Tekniskt värde','Personligt värde']);[...document.querySelectorAll('p')].forEach(p=>{if(labels.has(p.textContent.trim())){const h=document.createElement('h3');h.textContent=p.textContent.trim();p.replaceWith(h)}})}
</script></article></body></html>
