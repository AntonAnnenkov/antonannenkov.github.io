<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f1e8">
<title>Husköp — en praktisk guide</title>
<meta name="description" content="Husköp – en praktisk guide till ekonomi, vad som är värt att tänka på och beslut vid husköp.">
<style>
:root {
  --bg: #f5f1e8;
  --paper: #fffdf8;
  --text: #20231f;
  --muted: #6f746c;
  --line: #dedbd2;
  --accent: #315c4b;
  --accent-soft: #e7efe9;
  --button: #20231f;
  --button-text: #fffdf8;
  --shadow: 0 18px 50px rgba(33, 37, 32, .08);
}
html.dark {
  --bg: #111513;
  --paper: #191e1b;
  --text: #eef1ed;
  --muted: #aeb7b0;
  --line: #303833;
  --accent: #8fc6aa;
  --accent-soft: #203229;
  --button: #eef1ed;
  --button-text: #111513;
  --shadow: 0 18px 50px rgba(0, 0, 0, .24);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background:
    radial-gradient(circle at 50% -10%, rgba(49,92,75,.08), transparent 34rem),
    var(--bg);
  color: var(--text);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 18px;
  line-height: 1.78;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto 0;
  height: 3px;
  background: var(--accent);
  transform-origin: left;
  transform: scaleX(var(--progress, 0));
  z-index: 100;
}
.site-header {
  max-width: 1120px;
  margin: 0 auto;
  padding: 34px 28px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
}
.brand { display: flex; align-items: baseline; gap: 14px; }
.brand h1 {
  margin: 0;
  font: 750 25px/1.1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: -.035em;
}
.brand span {
  color: var(--muted);
  font: 500 12px/1 system-ui, sans-serif;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.header-actions { display: flex; align-items: center; gap: 9px; }
button {
  appearance: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--paper);
  color: var(--text);
  padding: 9px 13px;
  font: 650 12px/1 system-ui, sans-serif;
  cursor: pointer;
  transition: transform .15s ease, border-color .15s ease, background .15s ease;
}
button:hover { transform: translateY(-1px); border-color: var(--accent); }
button.primary { background: var(--button); color: var(--button-text); border-color: var(--button); }
.hero {
  max-width: 1120px;
  margin: 0 auto;
  padding: 58px 28px 44px;
}
.eyebrow {
  margin: 0 0 14px;
  color: var(--accent);
  font: 750 12px/1.2 system-ui, sans-serif;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.hero h2 {
  max-width: 780px;
  margin: 0;
  font: 760 clamp(40px, 6vw, 72px)/.98 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: -.055em;
}
.hero p {
  max-width: 680px;
  margin: 22px 0 0;
  color: var(--muted);
  font-size: 19px;
}
.hero-meta { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 25px; }
.pill {
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  font: 600 12px/1 system-ui, sans-serif;
}
.layout {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 28px 90px;
  display: grid;
  grid-template-columns: 210px minmax(0, 760px);
  gap: 52px;
  align-items: start;
}
.toc {
  position: sticky;
  top: 24px;
  padding: 17px 0;
  border-top: 1px solid var(--line);
}
.toc strong {
  display: block;
  margin-bottom: 10px;
  font: 750 11px/1.2 system-ui, sans-serif;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}
.toc a {
  display: block;
  padding: 5px 0;
  color: var(--muted);
  text-decoration: none;
  font: 550 12px/1.4 system-ui, sans-serif;
}
.toc a:hover, .toc a.active { color: var(--accent); }
article {
  min-width: 0;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 64px 72px 82px;
  box-shadow: var(--shadow);
}
article > h1:first-child { display: none; }
article h1, article h2 {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.18;
  letter-spacing: -.035em;
}
article h1 {
  position: relative;
  margin: 2.8em 0 .75em;
  font-size: clamp(28px, 4vw, 39px);
  scroll-margin-top: 30px;
}
article h1::before {
  content: "";
  display: block;
  width: 32px;
  height: 3px;
  margin-bottom: 15px;
  border-radius: 2px;
  background: var(--accent);
}
article h2 {
  margin: 2.35em 0 .7em;
  font-size: 22px;
  scroll-margin-top: 30px;
}
article p { margin: 0 0 1.15em; }
article strong { font-weight: 750; }
article ul { margin: -.3em 0 1.25em; padding-left: 1.25em; }
article li { padding-left: .18em; margin: .18em 0; }
article > p:first-of-type { font-size: 20px; }
article blockquote {
  margin: 1.7em 0;
  padding: 5px 0 5px 22px;
  border-left: 3px solid var(--accent);
}
.back-top {
  position: fixed;
  right: 22px;
  bottom: 22px;
  width: 42px;
  height: 42px;
  padding: 0;
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
}
.back-top.visible { opacity: 1; pointer-events: auto; }
.noscript {
  max-width: 760px;
  margin: 20px auto;
  padding: 20px;
  color: var(--muted);
  font-family: system-ui, sans-serif;
}
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; gap: 0; }
  .toc { display: none; }
  article { max-width: 760px; margin: 0 auto; }
}
@media (max-width: 620px) {
  body { font-size: 17px; }
  .site-header { padding: 22px 16px 14px; }
  .brand span { display: none; }
  .header-actions button span { display: none; }
  .hero { padding: 42px 20px 34px; }
  .hero h2 { font-size: 43px; }
  .hero p { font-size: 18px; }
  .layout { padding: 0 10px 55px; }
  article { padding: 38px 23px 52px; border-radius: 10px; }
  article h1 { font-size: 28px; }
  article h2 { font-size: 20px; }
  article > p:first-of-type { font-size: 18px; }
  .back-top { right: 14px; bottom: 14px; }
}
@media print {
  body { background: white; color: black; }
  .site-header, .hero, .toc, .back-top { display: none; }
  .layout { display: block; padding: 0; }
  article { border: 0; box-shadow: none; padding: 0; max-width: none; }
  article h1::before { background: black; }
}
</style>
</head>
<body>
<header class="site-header">
  <div class="brand"><h1>Husköp</h1><span>Praktisk guide</span></div>
  <div class="header-actions">
    <button id="print" type="button" aria-label="Skriv ut sidan">Skriv ut</button>
    <button id="darkMode" class="primary" type="button" aria-pressed="false">Mörkt läsläge</button>
  </div>
</header>
<section class="hero" aria-labelledby="hero-title">
  <p class="eyebrow">Ekonomi · beslut</p>
  <h2 id="hero-title">Köp ett hus ni har råd att äga.</h2>
  <p>En praktisk genomgång av vad som faktiskt spelar roll när ett hus ska bli både hem, tillgång och långsiktigt åtagande.</p>
</section>
<main class="layout">
  <nav class="toc" id="toc" aria-label="Innehåll"><strong>På sidan</strong></nav>
  <article id="content"><p class="noscript">Guiden laddas…</p></article>
</main>
<button class="back-top" id="backTop" type="button" aria-label="Till toppen">↑</button>
<script>
const root = document.documentElement;
const button = document.getElementById('darkMode');
const content = document.getElementById('content');
const toc = document.getElementById('toc');
const backTop = document.getElementById('backTop');
const sourceUrl = 'https://raw.githubusercontent.com/AntonAnnenkov/antonannenkov.github.io/804cea4080b50e89ed0adb169f4aac3c6cb6a140/index.html';

function applyDarkMode(on) {
  root.classList.toggle('dark', on);
  button.textContent = on ? 'Ljust läsläge' : 'Mörkt läsläge';
  button.setAttribute('aria-pressed', String(on));
  localStorage.setItem('huskop-dark-mode', on ? '1' : '0');
  document.querySelector('meta[name="theme-color"]').content = on ? '#111513' : '#f5f1e8';
}
applyDarkMode(localStorage.getItem('huskop-dark-mode') === '1');
button.addEventListener('click', () => applyDarkMode(!root.classList.contains('dark')));
document.getElementById('print').addEventListener('click', () => window.print());

function slugify(text) {
  return text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function buildToc() {
  const headings = [...content.querySelectorAll('h1')];
  headings.forEach((heading, i) => {
    if (!heading.id) heading.id = slugify(heading.textContent) + '-' + i;
    const link = document.createElement('a');
    link.href = '#' + heading.id;
    link.textContent = heading.textContent;
    toc.appendChild(link);
  });
  const links = [...toc.querySelectorAll('a')];
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        links.forEach(link => link.classList.toggle('active', link.getAttribute('href') === '#' + entry.target.id));
      }
    });
  }, { rootMargin: '-12% 0px -70% 0px' });
  headings.forEach(h => observer.observe(h));
}

function updateProgress() {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  const progress = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
  document.body.style.setProperty('--progress', progress);
  backTop.classList.toggle('visible', window.scrollY > 650);
}
window.addEventListener('scroll', updateProgress, { passive: true });
backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

fetch(sourceUrl, { cache: 'force-cache' })
  .then(response => { if (!response.ok) throw new Error('Kunde inte läsa guiden'); return response.text(); })
  .then(html => {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const sourceArticle = doc.querySelector('article');
    if (!sourceArticle) throw new Error('Guidens innehåll saknas');
    content.innerHTML = sourceArticle.innerHTML;
    buildToc();
    updateProgress();
  })
  .catch(() => {
    content.innerHTML = '<p><strong>Guiden kunde inte laddas just nu.</strong></p><p>Försök ladda om sidan. Om problemet kvarstår, kontrollera anslutningen till GitHub.</p>';
  });
</script>
</body>
</html>
