<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Husköp — uppdaterad version</title>
<meta name="description" content="Husköp – en praktisk guide till ekonomi, risker, teknik och beslut vid husköp.">
<style>
:root{--bg:#f5f1e8;--paper:#fffdf8;--text:#20231f;--muted:#6f746c;--line:#dedbd2;--accent:#315c4b;--accent-soft:#e7efe9;--button:#20231f;--button-text:#fffdf8;--warning:#9a5a00;--warning-soft:#fff1dc}
html.dark{--bg:#111513;--paper:#191e1b;--text:#eef1ed;--muted:#aeb7b0;--line:#303833;--accent:#8fc6aa;--accent-soft:#203229;--button:#eef1ed;--button-text:#111513;--warning:#f0b35a;--warning-soft:#392b19}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.78}.site-header{max-width:1120px;margin:0 auto;padding:34px 28px 20px;display:flex;justify-content:space-between;align-items:center;gap:28px}.brand{display:flex;align-items:baseline;gap:14px}.brand h1{margin:0;font:750 25px/1.1 system-ui,sans-serif}.brand span{color:var(--muted);font:500 12px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}.header-actions{display:flex;gap:9px}button{appearance:none;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--text);padding:9px 13px;font:650 12px/1 system-ui,sans-serif;cursor:pointer}button.primary{background:var(--button);color:var(--button-text);border-color:var(--button)}.hero{max-width:1120px;margin:0 auto;padding:58px 28px 44px}.eyebrow{margin:0 0 14px;color:var(--accent);font:750 12px/1.2 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase}.hero h2{max-width:780px;margin:0;font:760 clamp(40px,6vw,72px)/.98 system-ui,sans-serif;letter-spacing:-.055em}.hero p{max-width:680px;margin:22px 0 0;color:var(--muted);font-size:19px}.layout{max-width:1120px;margin:0 auto;padding:0 28px 90px;display:grid;grid-template-columns:210px minmax(0,760px);gap:52px}.toc{position:sticky;top:24px;align-self:start;padding:17px 0;border-top:1px solid var(--line)}.toc strong{display:block;margin-bottom:10px;font:750 11px/1.2 system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.toc a{display:block;padding:5px 0;color:var(--muted);text-decoration:none;font:550 12px/1.4 system-ui,sans-serif}.toc a:hover{color:var(--accent)}article{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:64px 72px 82px;box-shadow:0 18px 50px rgba(33,37,32,.08)}article h1,article h2{font-family:system-ui,sans-serif;line-height:1.18;letter-spacing:-.035em}article h1{position:relative;margin:2.8em 0 .75em;font-size:clamp(28px,4vw,39px)}article h1::before{content:"";display:block;width:32px;height:3px;margin-bottom:15px;border-radius:2px;background:var(--accent)}article h2{margin:2.35em 0 .7em;font-size:22px}article p{margin:0 0 1.15em}.calculator{margin:2em 0;padding:28px;border:1px solid var(--line);border-radius:14px;background:var(--accent-soft)}.calculator h2{margin:0 0 8px}.calculator-intro{color:var(--muted);font-size:16px;margin-bottom:22px}.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.calc-field label{display:block;margin-bottom:6px;font:650 12px/1.3 system-ui,sans-serif;color:var(--muted)}.calc-field input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:var(--paper);color:var(--text);font:500 16px system-ui,sans-serif}.calc-results{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:12px}.calc-result{padding:14px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}.calc-result span{display:block;color:var(--muted);font:600 11px/1.3 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em}.calc-result strong{display:block;margin-top:4px;font:750 22px/1.2 system-ui,sans-serif}.calc-note{margin:18px 0 0!important;color:var(--muted);font-size:14px!important}.calc-note a{color:var(--accent)}.calc-warning{margin:16px 0 0;padding:13px 15px;border:1px solid var(--warning);border-radius:10px;background:var(--warning-soft);color:var(--warning);font:600 14px/1.5 system-ui,sans-serif}.noscript{padding:20px;color:var(--muted);font-family:system-ui,sans-serif}@media(max-width:900px){.layout{grid-template-columns:1fr}.toc{display:none}article{max-width:760px;margin:0 auto}}@media(max-width:620px){body{font-size:17px}.site-header{padding:22px 16px 14px}.brand span{display:none}.hero{padding:42px 20px 34px}.layout{padding:0 10px 55px}article{padding:38px 23px 52px}.calc-grid,.calc-results{grid-template-columns:1fr}.calculator{padding:22px 18px}}
</style>
</head>
<body>
<header class="site-header"><div class="brand"><h1>Husköp</h1><span>Praktisk guide</span></div><div class="header-actions"><button id="print">Skriv ut</button><button id="darkMode" class="primary">Mörkt läsläge</button></div></header>
<section class="hero"><p class="eyebrow">Ekonomi · beslut</p><h2>Köp ett hus ni har råd att äga.</h2><p>En praktisk genomgång av vad som faktiskt spelar roll när ett hus ska bli både hem, tillgång och långsiktigt åtagande.</p></section>
<main class="layout"><nav class="toc" id="toc"><strong>På sidan</strong></nav><article id="content"><p class="noscript">Guidens innehåll laddas…</p></article></main>
<script>
const root=document.documentElement;document.getElementById('darkMode').onclick=()=>{root.classList.toggle('dark');localStorage.setItem('huskop-dark-mode',root.classList.contains('dark')?'1':'0')};if(localStorage.getItem('huskop-dark-mode')==='1')root.classList.add('dark');document.getElementById('print').onclick=()=>window.print();
const source='https://raw.githubusercontent.com/AntonAnnenkov/antonannenkov.github.io/main/index.html';
fetch(source,{cache:'no-store'}).then(r=>r.text()).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html'),article=doc.querySelector('article');if(!article)throw Error();const content=document.getElementById('content');content.innerHTML=article.innerHTML;const oldCalc=content.querySelector('.calculator');if(oldCalc)oldCalc.remove();
// Förord placeras före Del I.
const delI=[...content.querySelectorAll('h1')].find(h=>h.textContent.trim().startsWith('Del I'));if(delI){const h=document.createElement('h1');h.textContent='Förord';const paragraphs=[
'Jag tror starkt på att våga ta steget och lita på att små steg åt gången kan ge mycket god effekt i längden.',
'Det är kanske en ganska harmlös inställning, men jag tror att det blir lättare när man jämför sig mindre med andra och i stället tar saker i sin egen takt. Comparison is the thief of joy.',
'Sen handlar det också om att känna sig själv och våga stå upp för det man tycker ger livsglädje. För vissa är det ett radhus ute i Alingsås som gör skillnad – go for it! För andra är det hyresrätt kombinerat med resor – kör på! I värsta fall har man testat, lärt sig att detta inte var rätt och lämnar det med en erfarenhet rikare.',
'Den värsta alternativkostnaden är nog att bo där man egentligen inte trivs, längta efter något annat och samtidigt lägga pengar på hög utan att komma till skott. Det är pengar och tid som går förlorade i ett sådant läge.',
'Sen tror jag att alla har olika mål med sitt boende. Vissa vill köpa sitt boende, betala av hela lånet, känna sig skuldfri och lägga tid på hus och trädgård långt upp i åren. Andra kanske tycker att snickrande eller liknande är en viktig del av livsglädjen. Och för många är ett hus eller en större bostad framför allt en trevlig bonus – eller något man behöver när familjen växer och platsen inte längre räcker till. Livsglädje är olika för alla, och det finns garanterat många vägar dit.'
];delI.before(h);paragraphs.forEach(t=>{const p=document.createElement('p');p.textContent=t;h.after(p);h=h.nextElementSibling})}
// Flytta den befintliga räknesnurran till Del II kapitel 10 om kapitlet finns i innehållet.
const calc=document.createElement('section');calc.className='calculator';calc.id='boendebudget';calc.innerHTML=`<h2>Räkna på total boendekostnad</h2><p class="calculator-intro">Fyll i köpeskilling, kontantinsats, ränta, befintliga pantbrev och drift. Kalkylen visar bolånekostnad och en uppskattning av den totala månatliga boendekostnaden.</p><div class="calc-grid"><div class="calc-field"><label for="price">Köpeskilling</label><input id="price" type="number" min="0" step="10000" value="4000000"></div><div class="calc-field"><label for="down">Kontantinsats</label><input id="down" type="number" min="0" step="10000" value="600000"></div><div class="calc-field"><label for="rate">Ränta, % per år</label><input id="rate" type="number" min="0" step="0.01" value="3.15"></div><div class="calc-field"><label for="existing">Befintliga pantbrev</label><input id="existing" type="number" min="0" step="10000" value="2000000"></div><div class="calc-field"><label for="taxvalue">Taxeringsvärde (föregående år)</label><input id="taxvalue" type="number" min="0" step="10000" value="3000000"></div><div class="calc-field"><label for="drift">Driftskostnad / månad</label><input id="drift" type="number" min="0" step="500" value="6000"></div></div><div class="calc-results"><div class="calc-result"><span>Minsta kontantinsats (10 %)</span><strong id="minDownOut">–</strong></div><div class="calc-result"><span>Bolån</span><strong id="loanOut">–</strong></div><div class="calc-result"><span>Ränta / månad</span><strong id="interestOut">–</strong></div><div class="calc-result"><span>Amortering / månad</span><strong id="amortOut">–</strong></div><div class="calc-result"><span>Drift / månad</span><strong id="driftOut">–</strong></div><div class="calc-result"><span>Total boendekostnad / månad</span><strong id="totalOut">–</strong></div><div class="calc-result"><span>Lagfart</span><strong id="deedOut">–</strong></div><div class="calc-result"><span>Nya pantbrev</span><strong id="mortgageDeedOut">–</strong></div><div class="calc-result"><span>Lagfart + pantbrev</span><strong id="feesOut">–</strong></div><div class="calc-result"><span>Belåningsgrad</span><strong id="ltvOut">–</strong></div></div><p id="downWarning" class="calc-warning" hidden></p><p class="calc-note">Från 1 april 2026 är bolånetaket 90 % vid köp av en ny bostad, vilket normalt innebär minst 10 % kontantinsats. Lagfart beräknas här för privatperson: 1,5 % av det högsta av köpeskilling och föregående års taxeringsvärde + 825 kr. Pantbrev beräknas som 2 % av det belopp som behöver intecknas utöver befintliga pantbrev + 375 kr i expeditionsavgift. Källor: <a href="https://www.lantmateriet.se/sv/fastighet-och-mark/kopa-aga-salja-eller-ge-bort/Stampelskatt-och-avgifter/" target="_blank" rel="noopener">Lantmäteriet</a> och <a href="https://www.fi.se/sv/publicerat/nyheter/2026/fi-upphaver-foreskrifter-och-allmanna-rad-om-bolan--lag-tar-over/" target="_blank" rel="noopener">Finansinspektionen</a>.</p>`;
const chapter=[...content.querySelectorAll('h2')].find(h=>h.textContent.toLowerCase().includes('sätt en total boendebudget'));if(chapter){chapter.after(calc)}else{const delII=[...content.querySelectorAll('h1')].find(h=>h.textContent.trim().startsWith('Del II'));if(delII){const h=document.createElement('h2');h.textContent='10. Sätt en total boendebudget';delII.after(h);h.after(calc)}else{content.append(calc)}}
function fmt(n){return new Intl.NumberFormat('sv-SE',{style:'currency',currency:'SEK',maximumFractionDigits:0}).format(Math.round(n))}function calculate(){const price=+priceEl.value||0,down=+downEl.value||0,rate=+rateEl.value||0,existing=+existingEl.value||0,tax=+taxEl.value||0,drift=+driftEl.value||0;const loan=Math.max(0,price-down),minDown=price*.10,ltv=price>0?loan/price:0,interest=loan*rate/100/12,amort=loan*(ltv>.70?.02:ltv>.50?.01:0)/12,deed=Math.max(price,tax)*.015+825,newMortgage=Math.max(0,loan-existing),rounded=Math.floor(newMortgage/1000)*1000,mortgageDeed=rounded*.02+(rounded>0?375:0);minDownOut.textContent=fmt(minDown);loanOut.textContent=fmt(loan);interestOut.textContent=fmt(interest);amortOut.textContent=fmt(amort);driftOut.textContent=fmt(drift);totalOut.textContent=fmt(interest+amort+drift);deedOut.textContent=fmt(deed);mortgageDeedOut.textContent=fmt(mortgageDeed);feesOut.textContent=fmt(deed+mortgageDeed);ltvOut.textContent=(ltv*100).toFixed(1).replace('.',',')+' %';const warning=document.getElementById('downWarning');if(price>0&&down<minDown){warning.hidden=false;warning.innerHTML='<strong>Kontantinsatsen är under 10 %-kravet.</strong> Du har angett '+fmt(down)+', vilket är '+fmt(minDown-down)+' mindre än miniminivån.'}else warning.hidden=true}
const priceEl=document.getElementById('price'),downEl=document.getElementById('down'),rateEl=document.getElementById('rate'),existingEl=document.getElementById('existing'),taxEl=document.getElementById('taxvalue'),driftEl=document.getElementById('drift');calc.querySelectorAll('input').forEach(i=>i.addEventListener('input',calculate));calculate();
const toc=document.getElementById('toc');[...content.querySelectorAll('h1,h2')].forEach((h,i)=>{if(!h.id)h.id='avsnitt-'+i;const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;toc.append(a)})
}).catch(()=>{document.getElementById('content').innerHTML='<p>Kunde inte läsa guidens innehåll just nu.</p>'});
</script>
</body>
</html>
