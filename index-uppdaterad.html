<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Husköp</title><style>body{margin:0;background:#f5f1e8;color:#20231f;font:18px/1.78 Georgia,serif}.wrap{max-width:1120px;margin:auto;padding:40px 28px}.paper{max-width:760px;margin:auto;background:#fffdf8;padding:50px 65px;border:1px solid #dedbd2;border-radius:14px}h1,h2{font-family:system-ui,sans-serif}h1{margin-top:2.5em}h1:first-child{margin-top:0}.calculator{margin:2em 0;padding:28px;border:1px solid #dedbd2;border-radius:14px;background:#e7efe9}.grid,.results{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font:600 12px system-ui;color:#6f746c}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #dedbd2;border-radius:8px;font-size:16px}.results{margin-top:20px;padding-top:20px;border-top:1px solid #dedbd2}.result{padding:14px;background:#fffdf8;border:1px solid #dedbd2;border-radius:10px}.result span{display:block;font:600 11px system-ui;color:#6f746c;text-transform:uppercase}.result strong{display:block;font:750 22px system-ui;margin-top:4px}@media(max-width:700px){.wrap{padding:20px 10px}.paper{padding:30px 22px}.grid,.results{grid-template-columns:1fr}}</style></head><body><div class="wrap"><article class="paper" id="content"><p>Laddar…</p></article></div><script>
fetch('https://raw.githubusercontent.com/AntonAnnenkov/antonannenkov.github.io/804cea4080b50e89ed0adb169f4aac3c6cb6a140/index.html').then(r=>r.text()).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html'),a=doc.querySelector('article'),c=document.getElementById('content');c.innerHTML=a.innerHTML;const delI=[...c.querySelectorAll('h1')].find(h=>h.textContent.trim().startsWith('Del I'));if(delI){const h=document.createElement('h1');h.textContent='Förord';delI.before(h);['Jag tror starkt på att våga ta steget och lita på att små steg åt gången kan ge mycket god effekt i längden.','Det är kanske en ganska harmlös inställning, men jag tror att det blir lättare när man jämför sig mindre med andra och i stället tar saker i sin egen takt. Comparison is the thief of joy.','Sen handlar det också om att känna sig själv och våga stå upp för det man tycker ger livsglädje. För vissa är det ett radhus ute i Alingsås som gör skillnad – go for it! För andra är det hyresrätt kombinerat med resor – kör på! I värsta fall har man testat, lärt sig att detta inte var rätt och lämnar det med en erfarenhet rikare.','Den värsta alternativkostnaden är nog att bo där man egentligen inte trivs, längta efter något annat och samtidigt lägga pengar på hög utan att komma till skott. Det är pengar och tid som går förlorade i ett sådant läge.','Sen tror jag att alla har olika mål med sitt boende. Vissa vill köpa sitt boende, betala av hela lånet, känna sig skuldfri och lägga tid på hus och trädgård långt upp i åren. Andra kanske tycker att snickrande eller liknande är en viktig del av livsglädjen. Och för många är ett hus eller en större bostad framför allt en trevlig bonus – eller något man behöver när familjen växer och platsen inte längre räcker till. Livsglädje är olika för alla, och det finns garanterat många vägar dit.'].forEach(t=>{const p=document.createElement('p');p.textContent=t;h.after(p);h=p})}
const calc=document.createElement('section');calc.className='calculator';calc.innerHTML='<h2>10. Sätt en total boendebudget</h2><p>Räknesnurran är placerad här under Del II kapitel 10. Driftskostnad ingår med ett standardvärde på 6 000 kr/månad.</p><div class="grid"><div class="field"><label>Köpeskilling<input id="p" type="number" value="4000000"></label></div><div class="field"><label>Kontantinsats<input id="d" type="number" value="600000"></label></div><div class="field"><label>Ränta, % per år<input id="r" type="number" step="0.01" value="3.15"></label></div><div class="field"><label>Befintliga pantbrev<input id="e" type="number" value="2000000"></label></div><div class="field"><label>Taxeringsvärde<input id="t" type="number" value="3000000"></label></div><div class="field"><label>Driftskostnad / månad<input id="dr" type="number" value="6000"></label></div></div><div class="results"><div class="result"><span>Bolån</span><strong id="loan">–</strong></div><div class="result"><span>Ränta / månad</span><strong id="interest">–</strong></div><div class="result"><span>Amortering / månad</span><strong id="amort">–</strong></div><div class="result"><span>Drift / månad</span><strong id="drift">–</strong></div><div class="result"><span>Total boendekostnad / månad</span><strong id="total">–</strong></div><div class="result"><span>Lagfart + pantbrev</span><strong id="fees">–</strong></div></div></section>';const d2=[...c.querySelectorAll('h1')].find(h=>h.textContent.trim().startsWith('Del II'));if(d2){const h=document.createElement('h2');h.textContent='10. Sätt en total boendebudget';d2.after(h);h.after(calc)}else c.append(calc);function f(n){return new Intl.NumberFormat('sv-SE',{style:'currency',currency:'SEK',maximumFractionDigits:0}).format(Math.round(n))}function x(){const p=+document.getElementById('p').value||0,d=+document.getElementById('d').value||0,r=+document.getElementById('r').value||0,e=+document.getElementById('e').value||0,t=+document.getElementById('t').value||0,dr=+document.getElementById('dr').value||0,l=Math.max(0,p-d),ltv=p?l/p:0,i=l*r/100/12,am=l*(ltv>.7?.02:ltv>.5?.01:0)/12,n=Math.max(0,l-e),fees=Math.max(p,t)*.015+825+Math.floor(n/1000)*1000*.02+(n>0?375:0);loan.textContent=f(l);interest.textContent=f(i);amort.textContent=f(am);drift.textContent=f(dr);total.textContent=f(i+am+dr);document.getElementById('fees').textContent=f(fees)}calc.querySelectorAll('input').forEach(i=>i.addEventListener('input',x));x()}).catch(()=>document.getElementById('content').innerHTML='<p>Kunde inte läsa innehållet.</p>');</script></body></html>
